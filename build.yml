name: Build Omer TV APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Prepare project files
        run: |
          mkdir -p app/src/main/java/com/omertv/player app/src/main/res/layout
          [ -f app/build.gradle.kts ] || cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.omertv.player"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.omertv.player"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.media3:media3-exoplayer:1.2.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.2.1")
              implementation("androidx.media3:media3-ui:1.2.1")
          }
          EOF
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OmerTV"
          include(":app")
          EOF
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
      - name: Build APK
        run: gradle wrapper --gradle-version 8.5 && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: omer-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
